<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log — Console de test d'erreurs</title>
  <meta name="description" content="Déclenchez et visualisez des logs d'erreur en un clic." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="logo.png" />
</head>
<body>
  <div class="spotlight" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="logo.png" alt="Log" />
    </a>
    <button id="fire" class="btn btn-primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13l0-8Z"/></svg>
      Lancer un log d'erreur
    </button>
  </header>

  <main>
    <section class="terminal" aria-label="Terminal de logs">
      <div class="terminal-head">
        <span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="terminal-title">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="term-icon"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3.7 5.3 2.3 2.2-2.3 2.2 1 1L12.4 12 8.7 8.3l-1 1Z" /></svg>
          bash — log@vercel: ~/logs
        </span>
        <span class="terminal-live"><span class="dot"></span>live</span>
      </div>

      <div class="terminal-body">
        <div id="pinned" class="pinned" hidden>
          <div class="pinned-head">
            <span class="pin-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M14.5 2.5 21.5 9.5 19 12l-.9-.9-3.6 3.6.4 2.6-1.4 1.4-3.6-3.6-5.1 5.1-1.4-1.4 5.1-5.1-3.6-3.6 1.4-1.4 2.6.4L13 5.4l-.9-.9 2.4-2Z"/></svg>
            </span>
            erreurs épinglées
            <span id="pinCount" class="pin-count">0</span>
            <button id="unpin" class="pin-clear" type="button">tout désépingler</button>
          </div>
          <div id="pinnedList" class="pinned-list"></div>
        </div>

        <div id="stream" class="stream" role="log" aria-live="polite"></div>

        <div class="cursor-line" aria-hidden="true">
          <span class="prompt">log@vercel</span><span class="prompt-path">:~/logs</span><span class="prompt-sym">$</span>
          <span class="caret"></span>
        </div>
      </div>

      <div class="terminal-foot">
        <span id="count" class="foot-item">0 lignes</span>
        <span class="foot-sep">·</span>
        <span id="last" class="foot-item">en attente</span>
        <span class="foot-right">
          <span class="foot-item">UTF-8</span>
          <span class="foot-sep">·</span>
          <span id="clock" class="foot-item">--:--:--</span>
        </span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
